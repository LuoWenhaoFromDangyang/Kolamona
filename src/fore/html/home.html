<!DOCTYPE html>
<html>
    <head>
        <title>Kolamona</title>
        <meta charset="UTF-8">
        <link rel="icon" type="image/svg+xml" href="../svg/icon.svg">
    </head>
    <body>
        <div style="width: auto; height: auto; background-color: antiquewhite; padding-left: 0.5em; padding-right: 0.5em; outline: 0.2em solid blue;">
            <a href="welcome.html"><img src="../svg/icon.svg" width="30em" height="30em" onclick="" title="(the logo of kolamona)"></a><a href="welcome.html" style="font-size: 2em; font-weight: bold;color: pink;cursor: auto;text-decoration: none;">olamona</a>
        </div>
        <div style="width: auto; height: auto; background-color: antiquewhite; padding-left: 0.5em; padding-right: 0.5em; outline: 0.2em solid blue;">
            <a style="font-size: 2em; font-weight: bold;cursor: auto;text-decoration: none;
            color: blue;"
            href="home.html">
                Home
            </a>
            <a style="font-size: 2em; font-weight: bold;cursor: auto;text-decoration: none;
            color: chocolate;"
            href="about.html">
                About
            </a>
        </div>
        <noscript>
            <a style="font-size: 3em; font-weight: bold; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                Emm... There's no <span style="color: red;">script</span> :(
            </a>
        </noscript>
        <div id="rollVideoView"></div>
    </body>
    <script>
        const rollVideoView = document.getElementById('rollVideoView');
        (async () => {
            try {
                const response = await fetch('http://localhost:3000/api/videos/get/random');
                if (!response.ok) throw new Error('数据加载失败');
                const data = await response.json();

                Object.values(data).forEach(video => {
                    const span = document.createElement('span');
                    span.style="boder-radius: 0.5em; background-color: yellow; width: 400px;"
                    span.innerHTML = `
                        <div style="width: 400px; height: 225px; background-color: gray; color: white; text-align: center; line-height: 225px; border-radius: 0.5em; overflow: hidden;">
                            <a src="${video.Src ? `../videoview.html?src=${video.Src}` : `../videocannotplay.html?from='../home.html'`}">
                                <div>
                                    ${video.Picture ?
                                    `
                                    <img src="${video.Picture}" style="width: 100%; height: 100%;">
                                    `
                                    :
                                    `
                                    No picture available
                                    `
                                    }
                                </div>
                            </a>
                        </div>
                        <div style="color: #333333; font-size: 0.8em; display: flex; align-items: center;">
                            ${video.Maker.Head?`<img src="${video.Maker.Head}" width="25px" height="25px" style="border-radius: 50%;">`:''}
                            ${video.Maker.Official[0]?`<img src="../svg/official.svg" width="15px" height="15px" >`:''}
                            ${video.Maker.Name || 'Unknown'}
                        </div>
                        <div style="font-size: 1.5em; font-weight: bold; color: #111111;">
                            ${video.Title || 'Untitled'}
                        </div>
                        `;
                    rollVideoView.appendChild(span);
                });

                if (rollVideoView.children.length === 0) {
                    rollVideoView.innerHTML = '<a style="font-size: 3em; font-weight: bold; font-family: \'Segoe UI\', Tahoma, Geneva, Verdana, sans-serif;">Emm... There\'s nothing :(</a>';
                }
            } catch (err) {
                console.error('Error:', err.message);
                rollVideoView.innerHTML = '<a style="color: red; font-size: 3em; font-weight: bold; font-family: \'Segoe UI\', Tahoma, Geneva, Verdana, sans-serif;">Datas fly away</a>';
            }
        })();
    </script>
</html>
